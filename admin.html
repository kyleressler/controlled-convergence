<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Controlled Convergence</title>

  <!-- Supabase JS SDK (auth + database) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Quill rich-text editor (used by the Blog tab) -->
  <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.6/quill.snow.css">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js" defer></script>

  <!-- PostHog (behavioral analytics + UTM attribution) -->
  <script>

  <style>
    :root {
      --bg:        #f9f9f8;
      --surface:   #ffffff;
      --border:    #e2e2df;
      --text:      #1a1a18;
      --text-mut:  #6b6b66;
      --accent:    #1a56db;
      --accent-bg: #eaf0fb;
      --shadow:    0 1px 2px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Loading + gate states — visible until the auth check resolves. */
    #adminGate {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      color: var(--text-mut);
      font-size: 13px;
      z-index: 100;
    }
    body.admin-ready #adminGate { display: none; }

    /* Hide the shell until the gate resolves so the page never flashes content
       to a non-admin viewer. */
    #adminShell { display: none; }
    body.admin-ready #adminShell { display: block; }

    .admin-topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }

    .admin-brand {
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .admin-brand a {
      color: var(--text);
      text-decoration: none;
    }
    .admin-brand .admin-tag {
      color: var(--accent);
      font-weight: 700;
      margin-left: 4px;
    }

    .admin-tabs {
      display: flex;
      gap: 4px;
      flex: 1;
      margin-left: 24px;
    }
    .admin-tab {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--text-mut);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
    }
    .admin-tab:hover { background: var(--accent-bg); color: var(--accent); }
    .admin-tab.active {
      background: var(--accent-bg);
      color: var(--accent);
    }

    .admin-user {
      color: var(--text-mut);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .admin-user a {
      color: var(--text-mut);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .admin-user a:hover { background: var(--surface); color: var(--text); }

    .admin-refresh-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-mut);
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      cursor: pointer;
      padding: 0;
    }
    .admin-refresh-btn:hover { color: var(--accent); border-color: var(--accent); }
    .admin-refresh-btn:active { transform: scale(0.96); }
    .admin-refresh-btn.spinning svg {
      animation: admin-refresh-spin 0.7s linear;
    }
    @keyframes admin-refresh-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .admin-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .admin-pane { display: none; }
    .admin-pane.active { display: block; }

    .admin-pane h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 6px 0;
    }
    .admin-pane .pane-sub {
      color: var(--text-mut);
      margin-bottom: 20px;
    }

    .empty-card {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      color: var(--text-mut);
    }
    .empty-card strong { color: var(--text); display: block; margin-bottom: 6px; }

    /* ── Insights dashboard ─────────────────────────────────── */
    .insights-section { margin-bottom: 28px; }
    .insights-section h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-mut);
      margin: 0 0 12px;
    }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .metric-card .metric-label {
      font-size: 12px;
      color: var(--text-mut);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .metric-card .metric-value {
      font-size: 26px;
      font-weight: 600;
      margin-top: 4px;
      line-height: 1.1;
    }
    .metric-card .metric-sub {
      font-size: 12px;
      color: var(--text-mut);
      margin-top: 6px;
    }
    .metric-card.loading .metric-label { color: var(--text-mut); }

    .action-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .action-card.action-amber { border-left-color: #d97706; }
    .action-card.action-blue  { border-left-color: var(--accent); }
    .action-title { font-weight: 600; margin-bottom: 2px; }
    .action-body  { color: var(--text-mut); font-size: 13px; }

    .insights-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .insights-table th,
    .insights-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .insights-table th {
      background: var(--bg);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-mut);
      font-weight: 600;
    }
    .insights-table tr:last-child td { border-bottom: 0; }
    .insights-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .insights-table code {
      font-size: 12px;
      background: var(--bg);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .muted { color: var(--text-mut); font-size: 13px; }

    /* ── Blog tab ───────────────────────────────────────────── */
    .blog-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .blog-header h1 { margin: 0 0 4px; }

    .btn-primary, .btn-secondary, .btn-link {
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover { filter: brightness(0.95); }
    .btn-secondary:hover { background: var(--bg); }
    .btn-link {
      border: 0;
      background: transparent;
      color: var(--accent);
      padding: 4px 0;
    }
    .btn-link:hover { text-decoration: underline; }

    .blog-list-table td a { color: var(--text); text-decoration: none; }
    .blog-list-table td a:hover { color: var(--accent); }
    .blog-list-table .tag-chip {
      display: inline-block;
      background: var(--accent-bg);
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 11px;
      margin-right: 2px;
    }
    .evergreen-badge { color: #d97706; font-weight: 600; }

    .status-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      background: var(--bg);
      color: var(--text-mut);
      border: 1px solid var(--border);
    }
    .status-pill.status-published {
      background: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }
    .status-pill.status-draft {
      background: #fef3c7;
      color: #92400e;
      border-color: #fde68a;
    }

    /* ── Editor ─────────────────────────────────────────────── */
    .editor-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 880px) {
      .editor-grid { grid-template-columns: 1fr; }
    }
    .editor-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .editor-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-mut);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 14px 0 6px;
    }
    .editor-text {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      background: var(--surface);
      color: var(--text);
    }
    .editor-text:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }

    .editor-side .side-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .editor-side .side-section .editor-label:first-child { margin-top: 0; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .tag-input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      background: var(--accent-bg);
      color: var(--accent);
      padding: 2px 4px 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
    .tag-pill-x {
      background: transparent;
      border: 0;
      color: var(--accent);
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
    }
    .tag-pill-x:hover { color: #b91c1c; }

    /* Quill container — give it height + match border style */
    #editorQuillContainer { background: var(--surface); border-radius: 8px; }
    #editorQuill { min-height: 360px; background: var(--surface); }
    .ql-toolbar.ql-snow, .ql-container.ql-snow {
      border-color: var(--border) !important;
    }
    .ql-toolbar.ql-snow { border-radius: 6px 6px 0 0; }
    .ql-container.ql-snow { border-radius: 0 0 6px 6px; }
  </style>
</head>

<body>
  <!-- Gate: shown until isAdmin() resolves. Replaced by shell on success;
       redirects to app.html on failure. Prevents any flash of admin chrome. -->
  <div id="adminGate">Verifying admin access…</div>

  <div id="adminShell">
    <header class="admin-topbar">
      <div class="admin-brand">
        <a href="app.html#home">Controlled Convergence</a><span class="admin-tag">Admin</span>
      </div>

      <nav class="admin-tabs" role="tablist">
        <button class="admin-tab active" data-tab="insights" role="tab" aria-selected="true">Insights</button>
        <button class="admin-tab" data-tab="blog" role="tab" aria-selected="false">Blog</button>
        <button class="admin-tab" data-tab="email" role="tab" aria-selected="false">Email</button>
      </nav>

      <div class="admin-user">
        <button id="adminRefreshBtn" class="admin-refresh-btn" title="Refresh current tab" aria-label="Refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <span id="adminUserEmail"></span>
        <a href="app.html#home">← Back to app</a>
      </div>
    </header>

    <main class="admin-main">
      <!-- Insights pane is fully rendered by js/admin-insights.js → renderAdminInsights().
           Initial scaffold lives there too so loading states are local to the JS file. -->
      <section id="pane-insights" class="admin-pane active" role="tabpanel"></section>

      <!-- Blog pane is fully rendered by js/admin-blog.js → renderAdminBlog().
           Initial render happens lazily when the user clicks the Blog tab so
           Quill's CDN script has time to load. -->
      <section id="pane-blog" class="admin-pane" role="tabpanel"></section>

      <section id="pane-email" class="admin-pane" role="tabpanel">
        <h1>Email</h1>
        <p class="pane-sub">Kit subscriber stats and campaign attribution.</p>
        <div class="empty-card">
          <strong>Kit integration coming later.</strong>
          Wire your Kit API secret in to surface subscriber counts and campaign performance.
        </div>
      </section>
    </main>
  </div>

  <!-- Foundation scripts (must load before the gate runs) -->
  <script src="js/state.js"></script>
  <script src="js/config.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/admin-insights.js"></script>
  <script src="js/admin-blog.js"></script>

  <script>
    // ── Initialize PostHog (mirrors app.html init) ─────────────────────────
    if (typeof POSTHOG_KEY === 'string' && POSTHOG_KEY && window.posthog && typeof window.posthog.init === 'function') {
      window.posthog.init(POSTHOG_KEY, {
        api_host: POSTHOG_HOST,
        person_profiles: 'identified_only',
        capture_pageview: true
      });
    }

    // ── Admin gate ────────────────────────────────────────────────────────
    // Self-contained: doesn't pull in auth.js (which has UI deps that don't
    // exist on this page). On success, identifies the user with PostHog and
    // reveals the shell. On failure, redirects to app.html.
    (async function adminGate() {
      try {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session || !session.user) {
          window.location.href = 'app.html#login';
          return;
        }

        const { data: profile, error } = await _supabase
          .from('user_profiles')
          .select('tier, name, email')
          .eq('id', session.user.id)
          .single();

        if (error || !profile || profile.tier !== 'admin') {
          window.location.href = 'app.html#home';
          return;
        }

        // Hydrate the shared appState so analytics.js sees the right tier/user.
        appState.currentUser = {
          id:    session.user.id,
          email: session.user.email,
          name:  profile.name || session.user.email.split('@')[0],
          tier:  profile.tier
        };
        userTier = 'admin';

        if (typeof identifyUser === 'function') identifyUser(appState.currentUser);

        // Show user email in the topbar.
        const emailEl = document.getElementById('adminUserEmail');
        if (emailEl) emailEl.textContent = appState.currentUser.email;

        document.body.classList.add('admin-ready');

        // Pre-select tab from hash (e.g. admin.html#blog) so deep-links from
        // the main app's Admin Tools dropdown land on the right pane.
        const validTabs = ['insights', 'blog', 'email'];
        const hashTab = (window.location.hash || '').replace('#', '').toLowerCase();
        if (validTabs.indexOf(hashTab) !== -1) {
          activateAdminTab(hashTab);
        }

        // Custom page view event (PostHog also auto-captures $pageview).
        if (typeof trackEvent === 'function') trackEvent('page_viewed', { page: '#admin' });

        // Render the Insights dashboard now that the gate has succeeded and
        // the Supabase session is fully hydrated. Errors inside renderAdminInsights
        // are caught locally — we still want the shell visible if a single
        // section fails.
        if (typeof window.renderAdminInsights === 'function') {
          window.renderAdminInsights();
        }
      } catch (e) {
        // On any unexpected failure, bounce out rather than expose admin chrome.
        console.error('[admin-gate] error:', e);
        window.location.href = 'app.html#home';
      }
    })();

    // ── Tab switching ─────────────────────────────────────────────────────
    function activateAdminTab(tab) {
      document.querySelectorAll('.admin-tab').forEach(function (b) {
        const match = b.getAttribute('data-tab') === tab;
        b.classList.toggle('active', match);
        b.setAttribute('aria-selected', match ? 'true' : 'false');
      });
      document.querySelectorAll('.admin-pane').forEach(function (p) {
        p.classList.toggle('active', p.id === 'pane-' + tab);
      });
      // Sync hash so refreshes / back-button keep the user on the same tab
      // and copying the URL deep-links correctly.
      if (window.location.hash !== '#' + tab) {
        history.replaceState(null, '', window.location.pathname + '#' + tab);
      }
      // Lazy-render per-tab logic. Insights renders eagerly on gate success;
      // Blog renders here so Quill's CDN has time to settle before init.
      if (tab === 'blog' && typeof window.renderAdminBlog === 'function') {
        window.renderAdminBlog();
      }
    }

    document.querySelectorAll('.admin-tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        activateAdminTab(btn.getAttribute('data-tab'));
      });
    });

    // ── Refresh button ────────────────────────────────────────────────────
    // Re-renders the active tab. Each pane's render function is responsible
    // for re-fetching from its data source. The refresh is smart-skipped when
    // the user is mid-edit (admin-blog.js exposes adminBlogIsEditing()) so we
    // never blow away unsaved changes.
    function refreshActiveTab() {
      const btn = document.getElementById('adminRefreshBtn');
      if (btn) {
        btn.classList.remove('spinning');
        // Force reflow so the animation restarts on consecutive clicks.
        void btn.offsetWidth;
        btn.classList.add('spinning');
      }

      const activeTab = document.querySelector('.admin-tab.active');
      const tab = activeTab ? activeTab.getAttribute('data-tab') : null;

      if (tab === 'insights' && typeof window.renderAdminInsights === 'function') {
        window.renderAdminInsights();
      } else if (tab === 'blog' && typeof window.renderAdminBlog === 'function') {
        if (typeof window.adminBlogIsEditing === 'function' && window.adminBlogIsEditing()) {
          // Mid-edit; refreshing would discard the editor scaffold but leave
          // the in-memory _currentPost intact. Skip silently rather than
          // surprise the user.
          return;
        }
        window.renderAdminBlog();
      }
      // Email pane: nothing to refresh yet.
    }

    const refreshBtn = document.getElementById('adminRefreshBtn');
    if (refreshBtn) refreshBtn.addEventListener('click', refreshActiveTab);
  </script>
</body>
</html>
