# ============================================================
# netlify.toml — Netlify build + functions configuration
#
# The site is a static HTML/JS app, so there's no build command.
# Functions live in netlify/functions/ and are deployed automatically
# on every git push.
#
# Required environment variables (set in Netlify dashboard →
# Site settings → Environment variables; see .env.example):
#   POSTHOG_PERSONAL_API_KEY  — read-only PostHog Personal API Key (phx_…)
#   POSTHOG_PROJECT_ID        — numeric PostHog project ID
#   POSTHOG_HOST              — usually https://us.i.posthog.com
#   SUPABASE_URL              — same value as in js/config.js
#   SUPABASE_ANON_KEY         — same value as in js/config.js
# ============================================================

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  # Use the modern serverless runtime (Node 18+, native fetch available).
  node_bundler = "esbuild"


# ── URL rewrites ──────────────────────────────────────────────
# Status 200 = rewrite (URL stays clean in the browser, no redirect).
# Order matters — Netlify processes top to bottom and stops at the first match.
#
# /blog       → blog.html         (public index)
# /blog/      → blog.html         (trailing-slash variant)
# /blog/:slug → blog-post.html?slug=:slug  (single post; the loader reads ?slug=)

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/blog/"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/blog-post.html?slug=:slug"
  status = 200


# ── Cache headers ────────────────────────────────────────────
# Long-cache static assets so repeat visitors don't re-download. Images and
# stylesheets are versioned implicitly by content (we'll bump filenames if we
# need to bust). HTML is left short-cache so deploys reach users quickly.

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"


# ── Security headers ──────────────────────────────────────────
# These tell every visitor's browser how to handle the site safely.
#
# X-Frame-Options:          Prevents other websites from embedding your site
#                           inside their page (a "clickjacking" attack).
# X-Content-Type-Options:   Stops browsers from guessing what kind of file
#                           they're loading — prevents certain injection attacks.
# Referrer-Policy:          When a user clicks a link to leave your site, this
#                           limits how much info is shared with the destination.
# Content-Security-Policy:  A whitelist of exactly which external servers are
#                           allowed to load scripts, fonts, and styles on your
#                           pages. Anything not on the list gets blocked.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.quilljs.com https://cdnjs.cloudflare.com https://us-assets.i.posthog.com https://us.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.quilljs.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://jqelfzqgcemtrpcrbpsl.supabase.co https://us.i.posthog.com; frame-ancestors 'none';"
